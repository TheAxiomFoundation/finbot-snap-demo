name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Legal-link tests
        run: bun run test:legal-links
      - name: Catalog freshness
        # The committed catalog must equal what the pinned artifacts
        # generate — otherwise overlay/generator edits (or artifact renames
        # that silently orphan a global default) ship without taking effect.
        run: |
          bun run artifacts:fetch
          bun run catalog:generate
          git diff --exit-code src/lib/generated/catalog.json
      - name: Build
        # next build needs no secrets: API routes (OpenAI, engine) are
        # dynamic and only read env at request time. The committed
        # src/lib/generated/catalog.json makes the build hermetic — no
        # artifact fetch or Rust toolchain needed here.
        run: bun run build
